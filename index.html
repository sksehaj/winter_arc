<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Winter Arc</title>

    <!-- App Icon for iPhone Home Screen -->
    <link rel="apple-touch-icon" href="icon.png">

    <!-- iOS Full-Screen & Startup Screen Configuration -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Winter Arc">
    <meta name="theme-color" content="#000000">

    <!-- Prevent automatic phone number formatting on set/rep numbers -->
    <meta name="format-detection" content="telephone=no">

    <style>
        :root {
            --bg-color: #000000; /* Pure Black OLED Theme */
            --card-bg: #121212;
            --accent-color: #38bdf8;
            --accent-success: #22c55e;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #27272a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: calc(12px + env(safe-area-inset-top, 16px)) 16px calc(130px + env(safe-area-inset-bottom, 0px)) 16px;
            max-width: 600px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 1.5rem;
            color: var(--accent-color);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .day-selector {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-bottom: 20px;
        }

        .day-btn {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 10px 4px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s ease;
        }

        .day-btn.active {
            background-color: var(--accent-color);
            color: #000;
            border-color: var(--accent-color);
        }

        .workout-section {
            display: none;
        }

        .workout-section.active {
            display: block;
        }

        .section-title {
            font-size: 1.2rem;
            margin-bottom: 12px;
            color: var(--text-main);
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 6px;
        }

        .exercise-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 12px;
        }

        .exercise-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .exercise-name {
            font-size: 1rem;
            font-weight: 600;
        }

        .exercise-target {
            font-size: 0.85rem;
            color: var(--accent-color);
            background-color: rgba(56, 189, 248, 0.1);
            padding: 4px 8px;
            border-radius: 6px;
        }

        .sets-container {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .set-btn {
            flex: 1;
            min-width: 60px;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 8px;
            border-radius: 6px;
            font-size: 0.85rem;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s ease;
        }

        .set-btn.completed {
            background-color: var(--accent-success);
            color: #fff;
            border-color: var(--accent-success);
        }

        /* Timer Bar at Bottom */
        .timer-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background-color: rgba(18, 18, 18, 0.95);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-top: 1px solid var(--border-color);
            padding: 12px 20px calc(12px + env(safe-area-inset-bottom, 0px)) 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 600px;
            margin: 0 auto;
            z-index: 100;
        }

        .timer-display {
            font-size: 1.5rem;
            font-weight: 700;
            font-family: monospace;
            color: var(--accent-color);
        }

        .timer-controls {
            display: flex;
            gap: 8px;
        }

        .action-btn {
            background-color: var(--border-color);
            color: var(--text-main);
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
        }

        .action-btn.primary {
            background-color: var(--accent-color);
            color: #000;
        }
    </style>
</head>
<body>

    <header>
        <h1>Winter Arc</h1>
    </header>

    <div class="day-selector">
        <button class="day-btn active" onclick="switchDay('mon')">Mon</button>
        <button class="day-btn" onclick="switchDay('tue')">Tue</button>
        <button class="day-btn" onclick="switchDay('thu')">Thu</button>
        <button class="day-btn" onclick="switchDay('fri')">Fri</button>
    </div>

    <!-- MONDAY -->
    <div id="mon" class="workout-section active">
        <div class="section-title">Monday — Chest + Triceps</div>
        <div id="mon-exercises"></div>
    </div>

    <!-- TUESDAY -->
    <div id="tue" class="workout-section">
        <div class="section-title">Tuesday — Back + Biceps</div>
        <div id="tue-exercises"></div>
    </div>
