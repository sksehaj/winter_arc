<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Winter Arc</title>

    <!-- App Icon for iPhone Home Screen -->
    <link rel="apple-touch-icon" href="icon.png">

    <!-- iOS Full-Screen & Startup Screen Configuration -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Winter Arc">
    <meta name="theme-color" content="#0f172a">

    <!-- Prevent automatic phone number formatting on set/rep numbers -->
    <meta name="format-detection" content="telephone=no">

    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #38bdf8;
            --accent-success: #22c55e;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: env(safe-area-inset-top, 16px) 16px calc(130px + env(safe-area-inset-bottom, 0px)) 16px;
            max-width: 600px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 1.5rem;
            color: var(--accent-color);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .day-selector {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-bottom: 20px;
        }

        .day-btn {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 10px 4px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s ease;
        }

        .day-btn.active {
            background-color: var(--accent-color);
            color: #000;
            border-color: var(--accent-color);
        }

        .workout-section {
            display: none;
        }

        .workout-section.active {
            display: block;
        }

        .section-title {
            font-size: 1.2rem;
            margin-bottom: 12px;
            color: var(--text-main);
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 6px;
        }

        .exercise-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 12px;
        }

        .exercise-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .exercise-name {
            font-size: 1rem;
            font-weight: 600;
        }

        .exercise-target {
            font-size: 0.85rem;
            color: var(--accent-color);
            background-color: rgba(56, 189, 248, 0.1);
            padding: 4px 8px;
            border-radius: 6px;
        }

        .sets-container {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .set-btn {
            flex: 1;
            min-width: 60px;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 8px;
            border-radius: 6px;
            font-size: 0.85rem;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s ease;
        }

        .set-btn.completed {
            background-color: var(--accent-success);
            color: #fff;
            border-color: var(--accent-success);
        }

        /* Timer Bar at Bottom */
        .timer-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background-color: #1e293be6;
            backdrop-filter: blur(10px);
            border-top: 1px solid var(--border-color);
            padding: 12px 20px calc(12px + env(safe-area-inset-bottom, 0px)) 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 600px;
            margin: 0 auto;
            z-index: 100;
        }

        .timer-display {
            font-size: 1.5rem;
            font-weight: 700;
            font-family: monospace;
            color: var(--accent-color);
        }

        .timer-controls {
            display: flex;
            gap: 8px;
        }

        .action-btn {
            background-color: var(--border-color);
            color: var(--text-main);
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
        }

        .action-btn.primary {
            background-color: var(--accent-color);
            color: #000;
        }
    </style>
</head>
<body>

    <header>
        <h1>Winter Arc</h1>
    </header>

    <div class="day-selector">
        <button class="day-btn active" onclick="switchDay('mon')">Mon</button>
        <button class="day-btn" onclick="switchDay('tue')">Tue</button>
        <button class="day-btn" onclick="switchDay('thu')">Thu</button>
        <button class="day-btn" onclick="switchDay('fri')">Fri</button>
    </div>

    <!-- MONDAY -->
    <div id="mon" class="workout-section active">
        <div class="section-title">Monday — Chest + Triceps</div>
        <div id="mon-exercises"></div>
    </div>

    <!-- TUESDAY -->
    <div id="tue" class="workout-section">
        <div class="section-title">Tuesday — Back + Biceps</div>
        <div id="tue-exercises"></div>
    </div>

    <!-- THURSDAY -->
    <div id="thu" class="workout-section">
        <div class="section-title">Thursday — Shoulders + Chest</div>
        <div id="thu-exercises"></div>
    </div>

    <!-- FRIDAY -->
    <div id="fri" class="workout-section">
        <div class="section-title">Friday — Back + Arms + Forearms</div>
        <div id="fri-exercises"></div>
    </div>

    <!-- Rest Timer Bar -->
    <div class="timer-bar">
        <div>
            <div style="font-size: 0.75rem; color: var(--text-muted);">REST TIMER</div>
            <div class="timer-display" id="timer-display">01:00</div>
        </div>
        <div class="timer-controls">
            <button class="action-btn" onclick="addTime(-15)">-15s</button>
            <button class="action-btn" onclick="addTime(15)">+15s</button>
            <button class="action-btn primary" id="timer-toggle-btn" onclick="toggleTimer()">Start</button>
        </div>
    </div>

    <script>
        const workoutData = {
            mon: [
                { name: "Floor Press", reps: "12", sets: 3 },
                { name: "Floor Fly", reps: "8-10", sets: 2 },
                { name: "Dumbbell Pullover", reps: "10", sets: 2 },
                { name: "Triceps Extension", reps: "8-10", sets: 3 },
                { name: "Close-Grip Floor Press", reps: "10", sets: 2 }
            ],
            tue: [
                { name: "One-Arm Row", reps: "12/arm", sets: 3 },
                { name: "Reverse Fly", reps: "8-10", sets: 2 },
                { name: "Dumbbell Pullover", reps: "10", sets: 2 },
                { name: "Dumbbell Curl", reps: "8-10", sets: 3 },
                { name: "Hammer Curl", reps: "8-10", sets: 3 }
            ],
            thu: [
                { name: "Shoulder Press", reps: "6-8", sets: 3 },
                { name: "Lateral Raise", reps: "8-10", sets: 3 },
                { name: "Rear-Delt Fly", reps: "8-10", sets: 3 },
                { name: "Floor Press", reps: "10-12", sets: 3 },
                { name: "Floor Fly", reps: "8-10", sets: 2 }
            ],
            fri: [
                { name: "One-Arm Row", reps: "12/arm", sets: 3 },
                { name: "Reverse Fly", reps: "8-10", sets: 2 },
                { name: "Dumbbell Curl", reps: "8-10", sets: 3 },
                { name: "Hammer Curl", reps: "8-10", sets: 2 },
                { name: "Triceps Extension", reps: "8-10", sets: 3 },
                { name: "Close-Grip Floor Press", reps: "10", sets: 2 },
                { name: "Wrist Curl", reps: "12-15", sets: 2 },
                { name: "Reverse Wrist Curl", reps: "10-12", sets: 2 }
            ]
        };

        // Render Workouts
        function renderWorkouts() {
            Object.keys(workoutData).forEach(day => {
                const container = document.getElementById(`${day}-exercises`);
                container.innerHTML = '';
                
                workoutData[day].forEach((ex, exIndex) => {
                    const card = document.createElement('div');
                    card.className = 'exercise-card';
                    
                    let setsHTML = '';
                    for (let s = 1; s <= ex.sets; s++) {
                        const id = `${day}-${exIndex}-${s}`;
                        setsHTML += `<button id="${id}" class="set-btn" onclick="toggleSet('${id}')">Set ${s}</button>`;
                    }

                    card.innerHTML = `
                        <div class="exercise-header">
                            <span class="exercise-name">${ex.name}</span>
                            <span class="exercise-target">${ex.reps} reps</span>
                        </div>
                        <div class="sets-container">${setsHTML}</div>
                    `;
                    container.appendChild(card);
                });
            });
            restoreProgress();
        }

        // Switch Active Day
        function switchDay(dayKey) {
            document.querySelectorAll('.workout-section').forEach(sec => sec.classList.remove('active'));
            document.querySelectorAll('.day-btn').forEach(btn => btn.classList.remove('active'));
            
            document.getElementById(dayKey).classList.add('active');
            event.target.classList.add('active');
        }

        // Set Completion & Rest Timer Trigger
        function toggleSet(setId) {
            const btn = document.getElementById(setId);
            btn.classList.toggle('completed');
            
            // Save state
            const completedSets = JSON.parse(localStorage.getItem('completedSets') || '{}');
            completedSets[setId] = btn.classList.contains('completed');
            localStorage.setItem('completedSets', JSON.stringify(completedSets));

            // Start rest timer automatically on checking off set
            if (btn.classList.contains('completed')) {
                resetTimer(60);
                startTimer();
            }
        }

        function restoreProgress() {
            const completedSets = JSON.parse(localStorage.getItem('completedSets') || '{}');
            Object.keys(completedSets).forEach(setId => {
                const btn = document.getElementById(setId);
                if (btn && completedSets[setId]) {
                    btn.classList.add('completed');
                }
            });
        }

        // Audio Beep Generator
        function playBeep() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();

                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(880, audioCtx.currentTime);
                gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);

                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);

                oscillator.start();
                oscillator.stop(audioCtx.currentTime + 0.3);
            } catch (e) {
                console.log("Audio not supported");
            }
        }

        // Timer Logic
        let timerInterval = null;
        let timeLeft = 60;
        let isRunning = false;

        function updateDisplay() {
            const mins = Math.floor(timeLeft / 60);
            const secs = timeLeft % 60;
            document.getElementById('timer-display').innerText = 
                `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
        }

        function startTimer() {
            if (isRunning) clearInterval(timerInterval);
            isRunning = true;
            document.getElementById('timer-toggle-btn').innerText = 'Pause';
            
            timerInterval = setInterval(() => {
                if (timeLeft > 0) {
                    timeLeft--;
                    updateDisplay();
                } else {
                    clearInterval(timerInterval);
                    isRunning = false;
                    document.getElementById('timer-toggle-btn').innerText = 'Start';
                    
                    if (navigator.vibrate) {
                        navigator.vibrate([200, 100, 200, 100, 300]);
                    }
                    playBeep();
                }
            }, 1000);
        }

        function toggleTimer() {
            if (isRunning) {
                clearInterval(timerInterval);
                isRunning = false;
                document.getElementById('timer-toggle-btn').innerText = 'Start';
            } else {
                startTimer();
            }
        }

        function resetTimer(seconds) {
            clearInterval(timerInterval);
            isRunning = false;
            timeLeft = seconds;
            updateDisplay();
            document.getElementById('timer-toggle-btn').innerText = 'Start';
        }

        function addTime(seconds) {
            timeLeft = Math.max(0, timeLeft + seconds);
            updateDisplay();
        }

        // Initialize App
        renderWorkouts();
        updateDisplay();
    </script>
</body>
</html>
