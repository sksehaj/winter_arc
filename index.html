<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Winter Arc</title>

    <!-- App Icon for iPhone Home Screen -->
    <link rel="apple-touch-icon" href="icon.png">

    <!-- iOS Full-Screen & Startup Screen Configuration -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Winter Arc">
    <meta name="theme-color" content="#09090b">

    <!-- Prevent automatic phone number formatting on set/rep numbers -->
    <meta name="format-detection" content="telephone=no">

    <style>
        :root {
            --bg-color: #000000;
            --card-bg: #0a0a0a;
            --card-border: #27272a;
            --accent-color: #38bdf8;
            --accent-success: #22c55e;
            --text-main: #f8fafc;
            --text-muted: #a1a1aa;
            --border-color: #3f3f46;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: env(safe-area-inset-top, 16px) 16px calc(150px + env(safe-area-inset-bottom, 0px)) 16px;
            max-width: 600px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 16px;
        }

        h1 {
            font-size: 1.4rem;
            color: var(--accent-color);
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        .day-selector {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-bottom: 10px;
        }

        .day-btn {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            color: var(--text-muted);
            padding: 10px 4px;
            border-radius: 10px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s ease;
        }

        .day-btn.active {
            background-color: var(--accent-color);
            color: #000;
            border-color: var(--accent-color);
        }

        .reset-week-btn {
            width: 100%;
            background-color: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #ef4444;
            padding: 8px;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 16px;
            transition: all 0.2s;
        }

        .reset-week-btn:active {
            background-color: rgba(239, 68, 68, 0.2);
        }

        /* Premium Active Exercise View */
        .premium-workout-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .current-exercise-card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 18px;
        }

        .exercise-top-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 14px;
        }

        .exercise-title {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-main);
        }

        .exercise-meta {
            font-size: 0.85rem;
            color: var(--accent-color);
            background-color: rgba(56, 189, 248, 0.12);
            padding: 4px 10px;
            border-radius: 6px;
            font-weight: 600;
        }

        /* Sets Layout with Catchy Motivation Text */
        .sets-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 16px;
        }

        .set-row {
            display: grid;
            grid-template-columns: 60px 1fr 100px;
            gap: 10px;
            align-items: center;
            background: rgba(255, 255, 255, 0.02);
            padding: 10px 12px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .set-row.completed {
            background-color: rgba(34, 197, 94, 0.08);
            border-color: rgba(34, 197, 94, 0.3);
        }

        .set-label {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-muted);
            text-align: center;
        }

        .catchy-badge {
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            color: var(--accent-color);
            text-transform: uppercase;
            text-align: center;
            background: rgba(56, 189, 248, 0.08);
            padding: 6px;
            border-radius: 6px;
            border: 1px dashed rgba(56, 189, 248, 0.2);
        }

        .set-done-btn {
            background-color: var(--card-border);
            color: var(--text-muted);
            border: none;
            padding: 10px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .set-done-btn.completed {
            background-color: var(--accent-success);
            color: #fff;
        }

        /* Navigation Buttons between exercises */
        .exercise-nav-row {
            display: flex;
            gap: 10px;
        }

        .nav-ex-btn {
            flex: 1;
            background-color: var(--card-border);
            color: var(--text-main);
            border: none;
            padding: 10px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
        }

        .nav-ex-btn:active {
            opacity: 0.8;
        }

        /* Upcoming Exercise Preview Card */
        .upcoming-card {
            background-color: rgba(18, 18, 20, 0.6);
            border: 1px dashed var(--card-border);
            border-radius: 12px;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .upcoming-label {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .upcoming-name {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-muted);
        }

        .progress-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            padding: 14px 16px;
            margin: 0 0 12px;
        }
        .progress-heading { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:10px; }
        .progress-title { font-size:.9rem; font-weight:700; }
        .progress-percent { color:var(--accent-color); font-size:1rem; font-weight:800; font-variant-numeric:tabular-nums; }
        .progress-track { height:7px; overflow:hidden; border-radius:99px; background:#27272a; }
        .progress-fill { height:100%; width:0%; border-radius:99px; background:var(--accent-color); transition:width .35s ease; }
        .progress-meta { display:flex; justify-content:space-between; gap:8px; margin-top:9px; color:var(--text-muted); font-size:.78rem; }
        .progress-stats { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:12px; }
        .progress-stat { background:rgba(255,255,255,.03); border:1px solid rgba(255,255,255,.05); border-radius:9px; padding:9px 10px; }
        .progress-stat strong { display:block; font-size:1rem; color:var(--text-main); }
        .progress-stat span { color:var(--text-muted); font-size:.72rem; }

        /* Compact rest timer with a smooth circular countdown */
        .timer-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background-color: #09090bf2;
            backdrop-filter: blur(12px);
            border-top: 1px solid var(--card-border);
            padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px)) 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            max-width: 600px;
            margin: 0 auto;
            z-index: 100;
        }

        .timer-info {
            display: flex;
            align-items: center;
            gap: 11px;
            min-width: 0;
        }

        .timer-ring {
            --progress: 1;
            --ring-color: var(--accent-color);
            width: 58px;
            height: 58px;
            flex: 0 0 58px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            background: conic-gradient(var(--ring-color) calc(var(--progress) * 1turn), #27272a 0);
            transition: background 0.9s linear;
            position: relative;
        }

        .timer-ring::before {
            content: "";
            position: absolute;
            inset: 4px;
            border-radius: 50%;
            background: #09090b;
        }

        .timer-ring .timer-display {
            position: relative;
            z-index: 1;
            font-size: 0.78rem;
            font-weight: 700;
            font-family: monospace;
            color: var(--ring-color);
            letter-spacing: -0.5px;
            transition: color 0.5s ease;
        }

        .timer-label {
            font-size: 0.7rem;
            color: var(--text-muted);
            letter-spacing: 0.5px;
            margin-bottom: 3px;
        }

        .timer-status {
            font-size: 0.78rem;
            color: var(--text-muted);
        }

        .timer-controls {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            flex-wrap: wrap;
            gap: 6px;
        }

        .timer-bar.near-zero .timer-ring { --ring-color: #fbbf24; }
        .timer-bar.urgent .timer-ring { --ring-color: #f87171; }
        .timer-bar.finished .timer-ring { --ring-color: #22c55e; }

        @media (max-width: 390px) {
            .timer-bar { padding-left: 10px; padding-right: 10px; gap: 6px; }
            .timer-ring { width: 52px; height: 52px; flex-basis: 52px; }
            .action-btn { padding: 8px 9px; }
        }

        .action-btn {
            background-color: var(--card-border);
            color: var(--text-main);
            border: none;
            padding: 8px 12px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
        }

        .action-btn.primary {
            background-color: var(--accent-color);
            color: #000;
        }
    </style>
</head>
<body>

    <header>
        <h1>Winter Arc</h1>
    </header>

    <div class="day-selector" id="day-selector">
        <button class="day-btn active" onclick="switchDay('mon')">Mon</button>
        <button class="day-btn" onclick="switchDay('tue')">Tue</button>
        <button class="day-btn" onclick="switchDay('thu')">Thu</button>
        <button class="day-btn" onclick="switchDay('fri')">Fri</button>
    </div>

    <button class="reset-week-btn" onclick="resetWeek()">🔄 Reset Week Progress</button>

    <section class="progress-card" aria-label="Workout progress">
        <div class="progress-heading">
            <div class="progress-title" id="progress-day-title">Monday progress</div>
            <div class="progress-percent" id="progress-percent">0%</div>
        </div>
        <div class="progress-track" role="progressbar" aria-label="Daily workout completion" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="progress-track">
            <div class="progress-fill" id="progress-fill"></div>
        </div>
        <div class="progress-meta"><span id="progress-sets">0 of 12 sets complete</span><span>Daily completion</span></div>
        <div class="progress-stats">
            <div class="progress-stat"><strong id="week-days">0 / 4</strong><span>Workout days completed this week</span></div>
            <div class="progress-stat"><strong id="longest-streak">0 days</strong><span>Longest completion streak</span></div>
        </div>
    </section>

    <!-- Active Premium Workout Screen View -->
    <div class="premium-workout-container">
        <div class="current-exercise-card" id="current-exercise-card">
            <!-- Dynamically populated current exercise view -->
        </div>

        <div class="upcoming-card" id="upcoming-card">
            <div>
                <div class="upcoming-label">Up Next</div>
                <div class="upcoming-name" id="upcoming-name">--</div>
            </div>
            <div style="font-size: 0.85rem; color: var(--text-muted);" id="upcoming-target">--</div>
        </div>
    </div>

    <!-- Rest Timer Bar -->
    <div class="timer-bar" id="timer-bar">
        <div class="timer-info">
            <div class="timer-ring" id="timer-ring" role="img" aria-label="Rest countdown">
                <div class="timer-display" id="timer-display">01:00</div>
            </div>
            <div>
                <div class="timer-label">REST TIMER</div>
                <div class="timer-status" id="timer-status">Ready when you are</div>
            </div>
        </div>
        <div class="timer-controls">
            <button class="action-btn" onclick="addTime(-15)">-15s</button>
            <button class="action-btn" onclick="addTime(15)">+15s</button>
            <button class="action-btn primary" id="timer-toggle-btn" onclick="toggleTimer()">Start</button>
        </div>
    </div>

    <script>
        const workoutData = {
            mon: [
                { name: "Floor Press", reps: "12", sets: 3 },
                { name: "Floor Fly", reps: "8-10", sets: 2 },
                { name: "Dumbbell Pullover", reps: "10", sets: 2 },
                { name: "Triceps Extension", reps: "8-10", sets: 3 },
                { name: "Close-Grip Floor Press", reps: "10", sets: 2 }
            ],
            tue: [
                { name: "One-Arm Row", reps: "12/arm", sets: 3 },
                { name: "Reverse Fly", reps: "8-10", sets: 2 },
                { name: "Dumbbell Pullover", reps: "10", sets: 2 },
                { name: "Dumbbell Curl", reps: "8-10", sets: 3 },
                { name: "Hammer Curl", reps: "8-10", sets: 3 }
            ],
            thu: [
                { name: "Shoulder Press", reps: "6-8", sets: 3 },
                { name: "Lateral Raise", reps: "8-10", sets: 3 },
                { name: "Rear-Delt Fly", reps: "8-10", sets: 3 },
                { name: "Floor Press", reps: "10-12", sets: 3 },
                { name: "Floor Fly", reps: "8-10", sets: 2 }
            ],
            fri: [
                { name: "One-Arm Row", reps: "12/arm", sets: 3 },
                { name: "Reverse Fly", reps: "8-10", sets: 2 },
                { name: "Dumbbell Curl", reps: "8-10", sets: 3 },
                { name: "Hammer Curl", reps: "8-10", sets: 2 },
                { name: "Triceps Extension", reps: "8-10", sets: 3 },
                { name: "Close-Grip Floor Press", reps: "10", sets: 2 },
                { name: "Wrist Curl", reps: "12-15", sets: 2 },
                { name: "Reverse Wrist Curl", reps: "10-12", sets: 2 }
            ]
        };

        const catchyPhrases = [
            "STAY HARD 🔥",
            "EARN IT ⚡",
            "NO EXCUSES 💯",
            "LOCK IN 🎯",
            "PUSH THROUGH 🚀",
            "BEAST MODE 🦍"
        ];

        let currentDay = 'mon';
        let currentExerciseIndex = 0;

        const DAY_LABELS = { mon: 'Monday', tue: 'Tuesday', thu: 'Thursday', fri: 'Friday' };
        const DAY_KEYS = Object.keys(workoutData);
        const COMPLETION_DATES_KEY = 'winterArcCompletionDatesV1';

        // Storage wrappers keep the app usable if browser storage is temporarily unavailable.
        function safeGet(key, fallback = null) {
            try { const value = localStorage.getItem(key); return value === null ? fallback : value; }
            catch (e) { return fallback; }
        }
        function safeSet(key, value) {
            try { localStorage.setItem(key, value); return true; }
            catch (e) { console.warn('Could not save workout data in this browser.', e); return false; }
        }
        function safeRemove(key) { try { localStorage.removeItem(key); } catch (e) { console.warn('Could not remove saved data.', e); } }
        function readSetData(setId) {
            try { return JSON.parse(safeGet(setId, '{"completed":false}') || '{"completed":false}'); }
            catch (e) { return { completed: false }; }
        }
        function dayStats(dayKey) {
            const exercises = workoutData[dayKey] || [];
            const total = exercises.reduce((sum, ex) => sum + ex.sets, 0);
            let completed = 0;
            exercises.forEach((ex, exIndex) => {
                for (let set = 1; set <= ex.sets; set++) {
                    if (readSetData(`${dayKey}-${exIndex}-${set}`).completed) completed++;
                }
            });
            return { total, completed, percent: total ? Math.round(completed / total * 100) : 0 };
        }
        function getCompletionDates() {
            try { const dates = JSON.parse(safeGet(COMPLETION_DATES_KEY, '[]')); return Array.isArray(dates) ? dates : []; }
            catch (e) { return []; }
        }
        function recordCompletedDayIfNeeded(dayKey) {
            const stats = dayStats(dayKey);
            if (stats.percent !== 100) return;
            const now = new Date();
            const today = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
            const dates = getCompletionDates();
            if (!dates.some(item => item.date === today && item.day === dayKey)) {
                dates.push({ date: today, day: dayKey });
                safeSet(COMPLETION_DATES_KEY, JSON.stringify(dates));
            }
        }
        function getLongestStreak() {
            // A streak follows the workout schedule, not consecutive calendar days:
            // Mon -> Tue -> Thu -> Fri -> next Mon. Rest days do not break it.
            const dayOrder = { mon: 0, tue: 1, thu: 2, fri: 3 };
            const expectedGap = { mon: 1, tue: 2, thu: 1, fri: 3 };
            const entries = getCompletionDates()
                .filter(item => item && typeof item.date === 'string' &&
                    Object.prototype.hasOwnProperty.call(dayOrder, item.day) &&
                    /^\d{4}-\d{2}-\d{2}$/.test(item.date))
                .map(item => ({
                    date: item.date,
                    day: item.day,
                    timestamp: Date.parse(item.date + 'T12:00:00Z')
                }))
                .filter(item => Number.isFinite(item.timestamp))
                // Ignore malformed records whose date does not match the scheduled weekday.
                .filter(item => new Date(item.timestamp).getUTCDay() ===
                    ({ mon: 1, tue: 2, thu: 4, fri: 5 }[item.day]))
                .sort((a, b) => a.timestamp - b.timestamp || dayOrder[a.day] - dayOrder[b.day]);

            // De-duplicate repeated records for the same scheduled workout/date.
            const unique = entries.filter((item, index) => index === 0 ||
                item.date !== entries[index - 1].date || item.day !== entries[index - 1].day);
            let longest = 0, run = 0, previous = null;
            unique.forEach(item => {
                const gap = previous ? Math.round((item.timestamp - previous.timestamp) / 86400000) : null;
                const followsSchedule = previous && gap === expectedGap[previous.day] &&
                    dayOrder[item.day] === (dayOrder[previous.day] + 1) % 4;
                run = followsSchedule ? run + 1 : 1;
                longest = Math.max(longest, run);
                previous = item;
            });
            return longest;
        }
        function updateProgress() {
            const stats = dayStats(currentDay);
            const title = document.getElementById('progress-day-title');
            const percent = document.getElementById('progress-percent');
            const fill = document.getElementById('progress-fill');
            const track = document.getElementById('progress-track');
            if (!title) return;
            title.textContent = `${DAY_LABELS[currentDay]} progress`;
            percent.textContent = `${stats.percent}%`;
            fill.style.width = `${stats.percent}%`;
            track.setAttribute('aria-valuenow', String(stats.percent));
            document.getElementById('progress-sets').textContent = `${stats.completed} of ${stats.total} sets complete`;
            const completedDays = DAY_KEYS.filter(day => dayStats(day).percent === 100).length;
            document.getElementById('week-days').textContent = `${completedDays} / ${DAY_KEYS.length}`;
            document.getElementById('longest-streak').textContent = `${getLongestStreak()} ${getLongestStreak() === 1 ? 'day' : 'days'}`;
        }

        function switchDay(dayKey) {
            currentDay = dayKey;
            currentExerciseIndex = 0;
            
            document.querySelectorAll('.day-btn').forEach(btn => {
                btn.classList.toggle('active', btn.getAttribute('onclick') === `switchDay('${dayKey}')`);
            });
            
            renderActiveExercise();
        }

        function changeExercise(direction) {
            const exercises = workoutData[currentDay];
            currentExerciseIndex += direction;
            if (currentExerciseIndex < 0) currentExerciseIndex = 0;
            if (currentExerciseIndex >= exercises.length) currentExerciseIndex = exercises.length - 1;
            renderActiveExercise();
        }

        function renderActiveExercise() {
            const exercises = workoutData[currentDay];
            const ex = exercises[currentExerciseIndex];
            const card = document.getElementById('current-exercise-card');
            
            // Build sets rows with catchy badges instead of input fields
            let setsHTML = '';
            for (let s = 1; s <= ex.sets; s++) {
                const setId = `${currentDay}-${currentExerciseIndex}-${s}`;
                const savedData = readSetData(setId);
                // Pick a consistent catchy phrase based on set index
                const phrase = catchyPhrases[(s - 1) % catchyPhrases.length];
                
                setsHTML += `
                    <div class="set-row ${savedData.completed ? 'completed' : ''}" id="row-${setId}">
                        <div class="set-label">Set ${s}</div>
                        <div class="catchy-badge">${phrase}</div>
                        <button class="set-done-btn ${savedData.completed ? 'completed' : ''}" id="btn-${setId}" onclick="toggleSet('${setId}')">
                            ${savedData.completed ? 'Done' : 'Complete'}
                        </button>
                    </div>
                `;
            }

            card.innerHTML = `
                <div class="exercise-top-row">
                    <div>
                        <div style="font-size: 0.75rem; color: var(--text-muted); margin-bottom: 2px;">EXERCISE ${currentExerciseIndex + 1} OF ${exercises.length}</div>
                        <div class="exercise-title">${ex.name}</div>
                    </div>
                    <div class="exercise-meta">Target: ${ex.reps} reps</div>
                </div>
                <div class="sets-list">${setsHTML}</div>
                <div class="exercise-nav-row">
                    <button class="nav-ex-btn" onclick="changeExercise(-1)" ${currentExerciseIndex === 0 ? 'style="opacity:0.4; pointer-events:none;"' : ''}>← Prev</button>
                    <button class="nav-ex-btn primary" onclick="changeExercise(1)" ${currentExerciseIndex === exercises.length - 1 ? 'style="opacity:0.4; pointer-events:none;"' : ''}>Next →</button>
                </div>
            `;

            // Update Upcoming Preview
            const nextEx = exercises[currentExerciseIndex + 1];
            if (nextEx) {
                document.getElementById('upcoming-name').innerText = nextEx.name;
                document.getElementById('upcoming-target').innerText = `${nextEx.sets} sets • ${nextEx.reps} reps`;
                document.getElementById('upcoming-card').style.display = 'flex';
            } else {
                document.getElementById('upcoming-card').style.display = 'none';
            }
            updateProgress();
        }

        function toggleSet(setId) {
            const btn = document.getElementById(`btn-${setId}`);
            const row = document.getElementById(`row-${setId}`);
            
            btn.classList.toggle('completed');
            row.classList.toggle('completed');
            
            const isCompleted = btn.classList.contains('completed');
            btn.innerText = isCompleted ? 'Done' : 'Complete';

            safeSet(setId, JSON.stringify({ completed: isCompleted }));
            if (isCompleted) recordCompletedDayIfNeeded(currentDay);
            updateProgress();

            // Auto-trigger rest timer on completion
            if (isCompleted) {
                resetTimer(60);
                startTimer();
            }
        }

        function resetWeek() {
            if (confirm("Are you sure you want to reset all progress for a new week?")) {
                Object.keys(workoutData).forEach(day => {
                    workoutData[day].forEach((ex, exIndex) => {
                        for (let s = 1; s <= ex.sets; s++) {
                            safeRemove(`${day}-${exIndex}-${s}`);
                        }
                    });
                });
                renderActiveExercise();
                updateProgress();
            }
        }

        // Audio Beep Generator
        function playBeep() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();

                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(880, audioCtx.currentTime);
                gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);

                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);

                oscillator.start();
                oscillator.stop(audioCtx.currentTime + 0.3);
            } catch (e) {
                console.log("Audio not supported");
            }
        }

        // Timer Logic
        let timerInterval = null;
        let timeLeft = 60;
        let totalTime = 60;
        let isRunning = false;

        function updateDisplay() {
            const mins = Math.floor(timeLeft / 60);
            const secs = timeLeft % 60;
            document.getElementById('timer-display').innerText =
                `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;

            const ring = document.getElementById('timer-ring');
            const bar = document.getElementById('timer-bar');
            const status = document.getElementById('timer-status');
            const progress = totalTime > 0 ? Math.max(0, Math.min(1, timeLeft / totalTime)) : 0;
            ring.style.setProperty('--progress', progress);
            bar.classList.toggle('near-zero', timeLeft <= 20 && timeLeft > 10);
            bar.classList.toggle('urgent', timeLeft <= 10 && timeLeft > 0);
            bar.classList.toggle('finished', timeLeft === 0);

            if (timeLeft === 0) status.textContent = 'Rest complete';
            else if (isRunning) status.textContent = timeLeft <= 10 ? 'Almost ready…' : 'Recover & breathe';
            else status.textContent = timeLeft < totalTime ? 'Paused' : 'Ready when you are';
        }

        function startTimer() {
            if (isRunning) clearInterval(timerInterval);
            isRunning = true;
            document.getElementById('timer-toggle-btn').innerText = 'Pause';
            // Battery-friendly: keep the screen awake only while the rest countdown runs.
            keepScreenAwake();
            
            timerInterval = setInterval(() => {
                if (timeLeft > 0) {
                    timeLeft--;
                    updateDisplay();
                } else {
                    clearInterval(timerInterval);
                    isRunning = false;
                    releaseScreenWakeLock();
                    document.getElementById('timer-toggle-btn').innerText = 'Start';
                    updateDisplay();
                    
                    if (navigator.vibrate) {
                        navigator.vibrate([200, 100, 200, 100, 300]);
                    }
                    playBeep();
                }
            }, 1000);
        }

        function toggleTimer() {
            if (isRunning) {
                clearInterval(timerInterval);
                isRunning = false;
                releaseScreenWakeLock();
                document.getElementById('timer-toggle-btn').innerText = 'Start';
            } else {
                startTimer();
            }
        }

        function resetTimer(seconds) {
            clearInterval(timerInterval);
            isRunning = false;
            releaseScreenWakeLock();
            timeLeft = seconds;
            totalTime = seconds;
            document.getElementById('timer-bar').classList.remove('finished', 'near-zero', 'urgent');
            updateDisplay();
            document.getElementById('timer-toggle-btn').innerText = 'Start';
        }

        function addTime(seconds) {
            timeLeft = Math.max(0, timeLeft + seconds);
            totalTime = Math.max(1, timeLeft);
            if (timeLeft > 0) document.getElementById('timer-bar').classList.remove('finished');
            updateDisplay();
        }

        // Battery-friendly Screen Wake Lock: active only while the rest timer is running.
        // This avoids keeping the display awake during long pauses or after rest finishes.
        // Screen Wake Lock support generally requires HTTPS or localhost.
        let workoutWakeLock = null;
        let wakeLockRequestInProgress = false;

        async function keepScreenAwake() {
            if (!isRunning || !('wakeLock' in navigator) || document.visibilityState !== 'visible' || workoutWakeLock || wakeLockRequestInProgress) return;
            wakeLockRequestInProgress = true;
            try {
                workoutWakeLock = await navigator.wakeLock.request('screen');
                workoutWakeLock.addEventListener('release', () => {
                    workoutWakeLock = null;
                    // The browser can release a lock when the tab becomes hidden.
                    if (isRunning && document.visibilityState === 'visible') keepScreenAwake();
                }, { once: true });
            } catch (error) {
                // Unsupported browsers or system power-saving policies may deny the request.
                workoutWakeLock = null;
            } finally {
                wakeLockRequestInProgress = false;
            }
        }

        async function releaseScreenWakeLock() {
            if (!workoutWakeLock) return;
            const lock = workoutWakeLock;
            workoutWakeLock = null;
            try { await lock.release(); } catch (error) { /* Already released by browser. */ }
        }

        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible' && isRunning) keepScreenAwake();
        });
        window.addEventListener('pageshow', () => { if (isRunning) keepScreenAwake(); });

        // Initialize App
        renderActiveExercise();
        updateProgress();
        updateDisplay();
    </script>
</body>
</html>
